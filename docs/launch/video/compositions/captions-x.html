<style data-brand-tokens>

      @font-face { font-family: 'Geist'; src: url('assets/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
      @font-face { font-family: 'Geist'; src: url('assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
      :root {
      --ink: #1B1B1B;
      --cream: #F8F8F8;
      --tile: #FBEAE1;
      --tile-strong: #A04F2F;
      --coral: #CE623C;
      --mint: #7CC7A4;
      --navy: #181715;
      --navy-soft: #1F1E1B;
      --navy-elev: #252420;
      --cap-ink: #1B1B1B;
      --cap-canvas: #F8F8F8;
      --cap-accent: #CE623C;
      --cap-accent-2: #A04F2F;
      --font-display: "Geist", system-ui, serif;
      --font-body: "Geist", system-ui, sans-serif;
      --cap-band-top: 900px;
      --cap-band-height: 180px;
      }

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE lifted cream card — warm cream fill, 1px hairline ink border, one soft warm
     shadow (code-editorial's only elevation language), 12px radius, no tilt */
  .caption-pill {
    max-width: 78%;
    padding: 22px 44px 26px;
    background: var(--cap-canvas, #faf9f5);
    border: 1px solid color-mix(in srgb, var(--cap-ink, #141413) 12%, transparent);
    border-radius: 12px;
    box-shadow:
      0 1px 3px color-mix(in srgb, var(--cap-ink, #141413) 8%, transparent),
      0 4px 16px color-mix(in srgb, var(--cap-ink, #141413) 4%, transparent);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.12em 0.3em;
    font-family: "Geist", Georgia, serif;
    font-weight: 500;
    font-size: clamp(40px, 4.4vw, 56px);
    line-height: 1.24;
    letter-spacing: -0.02em;
  }

  /* upcoming — faint warm ink, no underline */
  .caption-word {
    display: inline-block;
    padding: 0 0.02em 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #141413) 40%, var(--cap-canvas, #faf9f5));
    border-bottom: 3px solid transparent;
  }
  /* current word — full ink under the coral voltage underline (the brand's signature
     inline-link gesture; border-bottom = underline without layout shift) */
  .caption-word.is-active {
    color: var(--cap-ink, #141413);
    border-bottom: 3px solid var(--cap-accent, #cc785c);
  }
  /* already spoken — solid warm ink, underline cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #141413);
    border-bottom: 3px solid transparent;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — the expressive EB Garamond italic */
  .caption-word.cap-brand {
    font-style: italic;
    color: var(--cap-ink, #141413);
  }
  .caption-word.cap-brand.is-active {
    border-bottom: 3px solid var(--cap-accent, #cc785c);
  }
  /* numerals / data — slightly recessed warm ink */
  .caption-word.cap-num {
    color: color-mix(in srgb, var(--cap-ink, #141413) 72%, var(--cap-canvas, #faf9f5));
  }
  /* emphasis — a persistent coral voltage underline */
  .caption-word.cap-cta {
    border-bottom: 3px solid var(--cap-accent-2, #b5654a);
    color: var(--cap-ink, #141413);
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 46px);
    }
  }
</style>

<script>

nt.", "start": 10.69, "end": 11.22}]}, {"id": "caption-group-6", "frame": 4, "start": 11.43, "end": 11.89, "text": "It warns", "words": [{"id": "caption-word-6-0", "text": "It", "start": 11.43, "end": 11.54}, {"id": "caption-word-6-1", "text": "warns", "start": 11.54, "end": 11.86}]}, {"id": "caption-group-7", "frame": 4, "start": 11.89, "end": 13.02, "text": "you when something's", "words": [{"id": "caption-word-7-0", "text": "you", "start": 11.89, "end": 12.09}, {"id": "caption-word-7-1", "text": "when", "start": 12.09, "end": 12.37}, {"id": "caption-word-7-2", "text": "something's", "start": 12.37, "end": 13.02}]}, {"id": "caption-group-8", "frame": 4, "start": 13.02, "end": 13.39, "text": "off.", "words": [{"id": "caption-word-8-0", "text": "off.", "start": 13.02, "end": 13.39}]}, {"id": "caption-group-9", "frame": 4, "start": 13.39, "end": 14.87, "text": "A duplicate charge.", "words": [{"id": "caption-word-9-0", "text": "A", "start": 13.39, "end": 13.43}, {"id": "caption-word-9-1", "text": "duplicate", "start": 13.43, "end": 14.13}, {"id": "caption-word-9-2", "text": "charge.", "start": 14.13, "end": 14.81}]}, {"id": "caption-group-10", "frame": 4, "start": 14.87, "end": 16.31, "text": "A new subscription.", "words": [{"id": "caption-word-10-0", "text": "A", "start": 14.87, "end": 14.91}, {"id": "caption-word-10-1", "text": "new", "start": 14.91, "end": 15.13}, {"id": "caption-word-10-2", "text": "subscription.", "start": 15.13, "end": 16.28}]}, {"id": "caption-group-11", "frame": 4, "start": 16.31, "end": 16.74, "text": "A budget", "words": [{"id": "caption-word-11-0", "text": "A", "start": 16.31, "end": 16.34}, {"id": "caption-word-11-1", "text": "budget", "start": 16.34, "end": 16.74}]}, {"id": "caption-group-12", "frame": 4, "start": 16.74, "end": 17.21, "text": "about to", "words": [{"id": "caption-word-12-0", "text": "about", "start": 16.74, "end": 17.07}, {"id": "caption-word-12-1", "text": "to", "start": 17.07, "end": 17.13}]}, {"id": "caption-group-13", "frame": 4, "start": 17.21, "end": 17.86, "text": "go over.", "words": [{"id": "caption-word-13-0", "text": "go", "start": 17.21, "end": 17.31}, {"id": "caption-word-13-1", "text": "over.", "start": 17.36, "end": 17.74}]}, {"id": "caption-group-14", "frame": 5, "start": 17.98, "end": 18.53, "text": "It sorts", "words": [{"id": "caption-word-14-0", "text": "It", "start": 17.98, "end": 18.03}, {"id": "caption-word-14-1", "text": "sorts", "start": 18.15, "end": 18.49}]}, {"id": "caption-group-15", "frame": 5, "start": 18.53, "end": 20.38, "text": "your transactions with AI.", "words": [{"id": "caption-word-15-0", "text": "your", "start": 18.53, "end": 18.85}, {"id": "caption-word-15-1", "text": "transactions", "start": 18.85, "end": 19.83}, {"id": "caption-word-15-2", "text": "with", "start": 19.83, "end": 19.95}, {"id": "caption-word-15-3", "text": "AI.", "start": 19.95, "end": 20.38}]}, {"id": "caption-group-16", "frame": 5, "start": 20.38, "end": 20.65, "text": "And it", "words": [{"id": "caption-word-16-0", "text": "And", "start": 20.38, "end": 20.43}, {"id": "caption-word-16-1", "text": "it", "start": 20.54, "end": 20.65}]}, {"id": "caption-group-17", "frame": 5, "start": 20.65, "end": 21.13, "text": "draws any", "words": [{"id": "caption-word-17-0", "text": "draws", "start": 20.65, "end": 20.94}, {"id": "caption-word-17-1", "text": "any", "start": 20.95, "end": 21.13}]}, {"id": "caption-group-18", "frame": 5, "start": 21.13, "end": 21.61, "text": "chart you", "words": [{"id": "caption-word-18-0", "text": "chart", "start": 21.13, "end": 21.43}, {"id": "caption-word-18-1", "text": "you", "start": 21.43, "end": 21.61}]}, {"id": "caption-group-19", "frame": 5, "start": 21.61, "end": 22.3, "text": "ask for.", "words": [{"id": "caption-word-19-0", "text": "ask", "start": 21.61, "end": 21.78}, {"id": "caption-word-19-1", "text": "for.", "start": 21.83, "end": 22.18}]}, {"id": "caption-group-20", "frame": 6, "start": 22.9, "end": 23.22, "text": "On your", "words": [{"id": "caption-word-20-0", "text": "On", "start": 22.9, "end": 22.97}, {"id": "caption-word-20-1", "text": "your", "start": 22.97, "end": 23.1}]}, {"id": "caption-group-21", "frame": 6, "start": 23.22, "end": 23.65, "text": "phone,", "words": [{"id": "caption-word-21-0", "text": "phone,", "start": 23.22, "end": 23.65}]}, {"id": "caption-group-22", "frame": 6, "start": 23.65, "end": 23.97, "text": "too.", "words": [{"id": "caption-word-22-0", "text": "too.", "start": 23.65, "end": 23.85}]}];
  var DURATION = 34.95;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? Math.min(DURATION, Number(group.end) + 0.3) : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)

        tl.fromTo(el, { scale: 0.98 }, { scale: 1, duration: 0.16, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
