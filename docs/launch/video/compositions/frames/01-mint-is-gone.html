    <script>
      (function () {
        const ID = "01-mint-is-gone";
        const D = 4.368;
        const tl = gsap.timeline({ paused: true });

        // Scene 1: "Mint" rises and settles, landing on "Mint?" (0.60s)
        tl.fromTo("#m01-mint", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.12);

        // Scene 2: "2007 — 2008" appears on "Every" (0.98s), then the end year cycles in place to 2024
        tl.fromTo("#m01-years", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.94);

        // discrete-text-sequence: instant year swaps, 2008 → 2024 across 1.33s..2.95s
        const SEQ = [];
        const T0 = 1.33, T1 = 2.95;
        for (let y = 2008; y <= 2024; y++) {
          SEQ.push({ t: T0 + ((y - 2008) / 16) * (T1 - T0), text: String(y) });
        }
        const endEl = document.getElementById("m01-end");
        function yearAt(t) {
          for (let i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i].text;
          return "2008";
        }
        const driver = { t: 0 };
        tl.to(driver, {
          t: D,
          duration: D,
          ease: "none",
          onUpdate: () => { endEl.textContent = yearAt(driver.t); },
        }, 0);

        // Scene 3: on "shut" (3.53s) a coral strike draws left→right through "Mint"; the word drops to ink@35%
        tl.fromTo("#m01-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#m01-mint", { opacity: 1 }, { opacity: 0.35, duration: 0.4, ease: "power1.out", immediateRender: false }, 3.62);
        tl.fromTo("#m01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 3.7);
        tl.fromTo("#m01-note", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 3.74);

        tl.set({}, {}, D);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
