        // Clamped so the card's top edge never drops more than 24px into the stage (no empty band).
        const CAM_MAX = (STAGE_H / 2) * (1 - 1 / S) + 24 / S;

        outline.style.width = (1036 - 20) * K + "px";

        // Scene 1 (0-1.8s): kicker, then the notification slides down into the upper third.
