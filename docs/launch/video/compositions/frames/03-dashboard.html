    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const D = 4.376;
        const tl = gsap.timeline({ paused: true });
        const camera = document.getElementById("dash03-camera");

        // Scene 1: kicker + window rise in
        tl.fromTo("#dash03-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.03);
        tl.fromTo("#dash03-window", { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.05);

        // Scene 2: pills pin on "Claude" (0.64) and "Codex" (1.38): press-release-spring
        [["#dash03-claude", 0.64], ["#dash03-codex", 1.38]].forEach(([sel, t]) => {
          tl.fromTo(sel, { opacity: 0, scale: 1 }, { opacity: 1, scale: 0.9, duration: 0.14, ease: "power1.in" }, t);
          tl.to(sel, { scale: 1, duration: 0.55, ease: "back.out(2)" }, t + 0.14);
        });

        // Camera: multi-phase (0.97 -> 1.0 settle -> gentle push toward net worth) + micro drift.
        // Net-worth figure sits at ~(178, 307); offset from center (-362, -233).
        // ponytail: partial counter-translate (12% of -offset) keeps the whole window in frame.
        const cam = { s: 0.97, x: 0, y: 0 };
        tl.to(cam, { s: 1.0, duration: 0.9, ease: "power2.out" }, 0);
        tl.to(cam, { s: 1.06, x: 43, y: 28, duration: 1.6, ease: "power2.inOut" }, 0.9);
        const drift = { p: 0 };
        tl.to(drift, {
          p: Math.PI * 2, duration: D, ease: "none",
          onUpdate: () => {
            const dx = Math.sin(drift.p) * 3;
            const dy = Math.sin(drift.p * 1.3) * 1.5;
            camera.style.transform = `scale(${cam.s}) translate(${cam.x + dx}px, ${cam.y + dy}px)`;
          },
        }, 0);

        window.__timelines["03-dashboard"] = tl;
      })();
