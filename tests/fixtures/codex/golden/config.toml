# Generated by finnamon from the assistant bundle (.claude/settings.json). `finnamon install` and `update`
# rewrite it; an edited copy is kept as config.toml.bak.
default_permissions = "finnamon"
approval_policy = "on-request"
web_search = "disabled"
cli_auth_credentials_store = "file"

[features]
hooks = true
apps = false   # codex_apps, the built-in ChatGPT-apps MCP server
browser_use = false
browser_use_external = false
in_app_browser = false
computer_use = false

[shell_environment_policy]
set = { FINNAMON_FROM_AGENT = "1", HOME = "$HOME", FINNAMON_HOME = "$FINNAMON_HOME" }

[permissions.finnamon]
extends = ":workspace"

[permissions.finnamon.filesystem]
":workspace_roots" = "read"
"$FINNAMON_HOME/assistant" = "read"
"$FINNAMON_HOME/secrets.toml" = "deny"
"$FINNAMON_HOME/finnamon.db" = "deny"
"$FINNAMON_HOME/finnamon.db-wal" = "deny"
"$FINNAMON_HOME/finnamon.db-shm" = "deny"
"$FINNAMON_HOME/finnamon.db-journal" = "deny"
"$FINNAMON_HOME/web-token" = "deny"
"$FINNAMON_HOME/web-hosts" = "deny"
"$FINNAMON_HOME/intercom.json" = "deny"
"$FINNAMON_HOME/imports" = "deny"
"$FINNAMON_HOME/chrome" = "deny"
"$FINNAMON_HOME/codex/sessions" = "deny"
"$FINNAMON_HOME/codex/auth.json" = "deny"
"$FINNAMON_HOME/user-codex/auth.json" = "deny"
"$HOME/.agent-browser" = "deny"
"$HOME/.claude/channels" = "deny"

[mcp_servers.finnamon]   # card 3 gives it the finnamon(argv) tool
command = "finnamon"
args = ["serve"]
env = { FINNAMON_FROM_AGENT = "1", HOME = "$HOME", FINNAMON_HOME = "$FINNAMON_HOME" }

[projects."$FINNAMON_HOME/assistant"]
trust_level = "trusted"

[[hooks.PreToolUse]]
matcher = "*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "finnamon hook secret-guard || exit 2"

[[hooks.PermissionRequest]]
matcher = "*"
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "finnamon hook permission"
timeout = 660
